<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Mini HTML App Builder</title>

<style>
  body {
    background:#111;
    color:#eee;
    font-family: monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    text-align:center;
  }
  button {
    padding:15px 25px;
    font-size:16px;
    background:#222;
    border:1px solid #444;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
  }
  button:active { background:#444; }
</style>
</head>
<body>

<h2>Mini HTML App Builder</h2>
<p>Click to download ZIP</p>

<button onclick="downloadZip()">Download</button>

<script>
async function downloadZip() {
  // URL to your external editor.html
  const editorURL = 'editor.html'; // <-- make sure this exists in your repo

  // Fetch the file content
  const response = await fetch(editorURL);
  if (!response.ok) return alert('Failed to fetch editor.html');
  const content = await response.text();

  // Create a ZIP containing editor.html
  const files = [
    { name: 'editor.html', content }
  ];

  const zipParts = [];
  let offset = 0;
  const central = [];

  files.forEach(file => {
    const data = new TextEncoder().encode(file.content);
    const header = new Uint8Array([
      80,75,3,4,20,0,0,0,0,0,0,0,0,0,
      data.length,0,0,0,
      data.length,0,0,0,
      file.name.length,0,0,0
    ]);
    zipParts.push(header, new TextEncoder().encode(file.name), data);

    const c = new Uint8Array([
      80,75,1,2,20,0,20,0,0,0,0,0,0,0,0,0,
      data.length,0,0,0,
      data.length,0,0,0,
      file.name.length,0,0,0,
      0,0,0,0,0,0,
      offset & 255,(offset>>8)&255,(offset>>16)&255,(offset>>24)&255
    ]);
    central.push(c, new TextEncoder().encode(file.name));
    offset += header.length + file.name.length + data.length;
  });

  const end = new Uint8Array([
    80,75,5,6,0,0,0,0,
    files.length,0,files.length,0,
    central.reduce((a,b)=>a+b.length,0),0,0,0,
    offset & 255,(offset>>8)&255,(offset>>16)&255,(offset>>24)&255,
    0,0
  ]);

  const blob = new Blob([...zipParts, ...central, end], { type: "application/zip" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "MiniHTMLBuilder.zip";
  a.click();
}
</script>

</body>
</html>
